services:
  - type: web
    name: billsplit-india-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: "npm install --include=dev && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
